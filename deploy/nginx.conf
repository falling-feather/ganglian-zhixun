# Managed for ganglian-zhixun
server {
    listen 80;
    listen [::]:80;
    server_name glzx.fallingfeather.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/glzx-acme;
        default_type text/plain;
    }
    location / { return 301 https://glzx.fallingfeather.cn$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name glzx.fallingfeather.cn;
    ssl_certificate /etc/letsencrypt/live/glzx.fallingfeather.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/glzx.fallingfeather.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:GLZXTLS:10m;
    client_max_body_size 64m;
    access_log /var/log/nginx/glzx.access.log;
    error_log /var/log/nginx/glzx.error.log;
    root /var/www/glzx.fallingfeather.cn/api-only-v3.0.2;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    location ~ ^/(api(?:/|$)|health$) {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }
}
